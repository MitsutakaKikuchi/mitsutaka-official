# main ブランチへの push、毎日定時、手動実行で GitHub Pages へデプロイする
name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:
  # 毎日 06:00 JST（前日 21:00 UTC）にスプレッドシートを読み直して再デプロイする
  schedule:
    - cron: '0 21 * * *'

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      SCHEDULE_CSV_URL: ${{ vars.SCHEDULE_CSV_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Build with Astro
        uses: withastro/action@v3
        env:
          SCHEDULE_CSV_URL: ${{ vars.SCHEDULE_CSV_URL }}
        with:
          node-version: 20

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
